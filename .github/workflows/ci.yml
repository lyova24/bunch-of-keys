name: CI
on:
  push:
    branches: [master, macos]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: Native macOS checks (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check synchronized version
        run: bash scripts/check-version-sync.sh
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test core and storage compatibility
        run: cargo test --locked
      - name: Build native application
        env:
          KEEPY_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-macos.sh
      - name: Test Swift client against the bundled service
        if: matrix.arch == 'arm64'
        run: bash scripts/test-native.sh
      - name: Smoke-test the signed bundle launch
        if: matrix.arch == 'arm64'
        run: python3 scripts/test-bundle-launch.py target/macos/arm64/Keepy.app
      - name: Verify update signatures and reject corrupt archives
        if: matrix.arch == 'arm64'
        run: bash scripts/test-updates.sh
