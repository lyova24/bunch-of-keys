name: Build macOS package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: build-macos-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Check version synchronization
        run: bash scripts/check-version-sync.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-macos-
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build application and DMG
        run: cargo tauri build --bundles app,dmg --ci -- --locked
      - name: Prepare artifact
        id: artifact
        run: |
          version="$(sed -n '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          package="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$package"
          mkdir -p dist
          artifact="dist/bunch-of-keys_${version}_${{ matrix.arch }}.dmg"
          cp "$package" "$artifact"
          shasum -a 256 "$artifact" > "$artifact.sha256"
          echo "name=bunch-of-keys-${version}-macos-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
