name: Build macOS package
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: macos
        type: string
permissions:
  contents: read
concurrency:
  group: build-macos-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/macos-toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build native application and DMG
        env:
          KEEPY_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-macos.sh --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Keepy-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
