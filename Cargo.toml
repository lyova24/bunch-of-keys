[package]
name = "keepy"
version = "2.2.1"
description = "Keepy, a native macOS encrypted credential manager"
authors = ["Keepy contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[[bin]]
name = "keepy-core"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
directories = "6"
rand = "0.8.5"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
ssh-key = { version = "0.6.7", features = ["crypto", "encryption", "rand_core"] }
ssh-agent-lib = "0.6"
signature = "2"
sha1 = { version = "0.10", default-features = false, features = ["oid"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
